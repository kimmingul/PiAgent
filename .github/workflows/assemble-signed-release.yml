name: Transfer verified PiAgent 0.10.0 installer

on:
  push:
    branches: [codex/release-upload-0.10.0]
    paths: [.github/workflows/assemble-signed-release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signed-release-0.10.0
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: kimmingul/PiAgent
    steps:
      - name: Fetch the original signed installer from the temporary transfer endpoint
        env:
          SOURCE_URL: https://scenarios-liked-eric-personality.trycloudflare.com/PiAgent-Setup-0.10.0.exe
        run: curl --http1.1 --fail --location --retry 4 --retry-all-errors --continue-at - --connect-timeout 30 --max-time 1200 --output PiAgent-Setup-0.10.0.exe "$SOURCE_URL"
      - name: Verify the original signed bytes
        shell: python
        run: |
          import hashlib
          import pathlib
          output = pathlib.Path('PiAgent-Setup-0.10.0.exe')
          assert output.stat().st_size == 210935840, 'Installer size mismatch'
          with output.open('rb') as source:
              digest = hashlib.file_digest(source, 'sha256').hexdigest()
          assert digest == 'ae4554cac94a46b6bfb2c90cea97dbac85df7461112a217c0be65a8e2ea9e1b5', 'Installer SHA-256 mismatch'
          print('PASS original signed installer bytes / SHA-256', digest)
      - name: Upload the verified installer without publishing the draft
        run: gh release upload v0.10.0 PiAgent-Setup-0.10.0.exe
