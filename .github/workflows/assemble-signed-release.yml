name: Restore verified PiAgent 0.10.0 installer

on:
  push:
    branches: [codex/release-upload-0.10.0]
    paths: [.github/workflows/assemble-signed-release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signed-release-0.10.0
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: kimmingul/PiAgent
    steps:
      - name: Fetch the published base installer and small delta parts
        run: |
          gh release download v0.9.20 --pattern PiAgent-Setup-0.9.20.exe --dir base
          gh release download v0.10.0 --pattern 'PiAgent-Setup-0.10.0.delta.part-*' --dir delta
      - name: Restore and verify the original signed bytes
        shell: python
        run: |
          import hashlib
          import pathlib
          import gzip
          import json
          import base64
          base_path = pathlib.Path('base/PiAgent-Setup-0.9.20.exe')
          with base_path.open('rb') as source:
              assert hashlib.file_digest(source, 'sha256').hexdigest() == 'f910df02efc2e4de2f064032c014517029dbfb66c9eb27f97fee7bf5c3573f4a', 'Published base digest mismatch'
          root = pathlib.Path('delta')
          names = [f'PiAgent-Setup-0.10.0.delta.part-{i:03}' for i in range(9)]
          assert sorted(p.name for p in root.iterdir()) == names, 'Missing or unexpected delta parts'
          packed = b''.join((root / name).read_bytes() for name in names)
          assert len(packed) == 1116656, 'Delta size mismatch'
          assert hashlib.sha256(packed).hexdigest() == '0b7f21006b6ae804c3d2e95dcb4318c7e80a456ac0bcebf8fc1ccb9ca3a10643', 'Delta digest mismatch'
          patch = json.loads(gzip.decompress(packed))
          assert patch['version'] == 1 and patch['targetSize'] == 210935840
          assert patch['baseDigest'] == 'f910df02efc2e4de2f064032c014517029dbfb66c9eb27f97fee7bf5c3573f4a'
          assert patch['targetDigest'] == 'ae4554cac94a46b6bfb2c90cea97dbac85df7461112a217c0be65a8e2ea9e1b5'
          assert len(patch['operations']) <= 10000
          output = pathlib.Path('PiAgent-Setup-0.10.0.exe')
          written = 0
          with base_path.open('rb') as source, output.open('xb') as target:
              for operation in patch['operations']:
                  if operation[0] == 'c':
                      _, offset, length = operation
                      assert isinstance(offset, int) and isinstance(length, int)
                      assert offset >= 0 and length > 0 and offset + length <= 210887200
                      source.seek(offset)
                      data = source.read(length)
                      assert len(data) == length
                  else:
                      assert operation[0] == 'n' and len(operation) == 2
                      data = base64.b64decode(operation[1], validate=True)
                  written += len(data)
                  assert written <= 210935840
                  target.write(data)
          assert output.stat().st_size == 210935840, 'Installer size mismatch'
          with output.open('rb') as source:
              digest = hashlib.file_digest(source, 'sha256').hexdigest()
          assert digest == 'ae4554cac94a46b6bfb2c90cea97dbac85df7461112a217c0be65a8e2ea9e1b5', 'Installer SHA-256 mismatch'
          print('PASS original signed installer bytes / SHA-256', digest)
      - name: Upload the verified installer without publishing the draft
        run: gh release upload v0.10.0 PiAgent-Setup-0.10.0.exe
