<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'">
<title>PiAgent Chat</title><link rel="stylesheet" href="chat.css"><script type="module" src="chat.js"></script></head>
<body><header><strong>PiAgent</strong><div><button id="connect">연결</button><button id="reset" disabled>새 대화</button></div></header>
<p id="status" role="status">Core를 실행한 뒤 연결해 주세요.</p><main id="transcript" aria-label="대화"></main>
<form id="composer"><label for="message">메시지</label><textarea id="message" rows="3" placeholder="질문을 입력하세요. Shift+Enter로 줄바꿈"></textarea>
<div><button id="capture" type="button" disabled>선택 코드 가져오기</button><button id="clearContext" type="button" disabled>첨부 해제</button></div>
<details id="contextPreview" hidden><summary id="contextLabel">선택 코드 첨부</summary><pre id="contextText"></pre></details>
<footer><span>텍스트 채팅 · 파일 변경 도구 없음</span><button id="stop" type="button" disabled>취소</button><button id="send" disabled>보내기</button></footer></form></body></html>
