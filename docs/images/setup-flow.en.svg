<svg xmlns="http://www.w3.org/2000/svg" width="920" height="900" viewBox="0 0 920 900" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">PiAgent installation sequence</title><desc id="desc">1. Prepare one IDE. Visual Studio 2022/2026 or RAD Studio 13.2. Open and build a project first.. 2. Check basic tools. WebView2 Runtime · Git for code changes. Unified setup includes Node.js / .NET runtimes.. 3. Install PiAgent + OMP. Close IDEs → select Core + your IDE adapters. If OMP is missing, select Install OMP in setup.. 4. Configure one AI connection. Choose Claude, Codex, xAI, Google or Ollama. Cloud: account/API key · Local: Ollama + model. 5. Verify an OMP answer. Select a model → ask without changing files. Check a normal answer before opening the IDE.. 6. Start chat in the IDE. Open project → PiAgent → read-only request. Then try a small change and review approval.</desc>
