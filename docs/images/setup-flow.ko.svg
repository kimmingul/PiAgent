<svg xmlns="http://www.w3.org/2000/svg" width="920" height="900" viewBox="0 0 920 900" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">PiAgent 설치 순서</title><desc id="desc">1. IDE 하나 준비. Visual Studio 2022/2026 또는 RAD Studio 13.2. 먼저 프로젝트를 열고 빌드해 보세요.. 2. 기본 도구 확인. WebView2 Runtime · 코드 변경용 Git. 통합 설치본에는 Node.js / .NET runtime이 포함됩니다.. 3. PiAgent + OMP 설치. IDE 종료 → Core + 사용할 IDE adapter 선택. OMP가 없으면 설치기에서 OMP 설치를 선택하세요.. 4. AI 연결 하나 설정. Claude · Codex · xAI · Google · Ollama 중 선택. 클라우드: 계정/API 키 · 로컬: Ollama + 모델. 5. OMP 답변 확인. 모델 선택 → 파일 변경 없는 간단한 질문. 정상 답변을 확인한 다음 IDE를 여세요.. 6. IDE에서 첫 대화. 프로젝트 열기 → PiAgent → 읽기 요청. 응답 확인 후 작은 변경과 승인으로 진행하세요.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#005fb8"/></marker></defs>
